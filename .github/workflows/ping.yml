name: Keep Render Awake

on:
  schedule:
    - cron: "*/7 6-23 * * *"
    - cron: "*/30 0-5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app (robust)
        shell: bash
        run: |
          set -e

          URL="https://www.ronaldpio.pt/healthz"
          echo "Pinging: $URL"

          # 8 tentativas com espera (aguenta cold start)
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i..."

            # Faz GET, segue redirect, timeout maior
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 45 \
              -H "User-Agent: keep-render-awake" \
              "$URL" || echo "000")

            echo "HTTP $code"

            # aceita 200-399
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "OK ✅"
              exit 0
            fi

            echo "Not ready yet. Waiting 15s..."
            sleep 15
          done

          echo "Ping failed after retries ❌"
          exit 1

