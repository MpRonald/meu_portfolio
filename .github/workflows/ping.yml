name: Keep Render Awake

on:
  schedule:
    - cron: "*/7 6-23 * * *"
    - cron: "*/30 0-5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "Pinging Render app..."
          curl -I --max-time 10 --retry 2 --retry-delay 3 https://www.ronaldpio.pt/healthz
