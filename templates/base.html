<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}My Portfolio{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">

  <!-- MINIMAL NAVBAR -->
  <nav class="navbar navbar-expand-lg app-navbar shadow-sm">
    <div class="container-xl">

      <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">
        My Portfolio
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">

          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
               href="{{ url_for('index') }}">
              Home
            </a>
          </li>

          <!-- Projects dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle
              {% if request.endpoint in ['ames_dashboard','sales_dashboard','data_cleaner'] %}active{% endif %}"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              Projects
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item {% if request.endpoint == 'ames_dashboard' %}active{% endif %}"
                   href="{{ url_for('ames_dashboard') }}">
                  Real Estate (Ames)
                </a>
              </li>
              <li>
                <a class="dropdown-item {% if request.endpoint == 'sales_dashboard' %}active{% endif %}"
                   href="{{ url_for('sales_dashboard') }}">
                  Sales Dashboard (Walmart)
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item {% if request.endpoint == 'data_cleaner' %}active{% endif %}"
                   href="{{ url_for('data_cleaner') }}">
                  Data Cleaner & Report
                </a>
              </li>
            </ul>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- CONTENT -->
  <main class="app-main py-4">
    <div class="container-xl">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page specific scripts -->
  {% block scripts %}{% endblock %}

  <footer class="app-footer py-3 mt-4 text-center small text-muted">
    © {{ current_year }} · Data Science Portfolio · Flask
  </footer>

</body>
</html>
